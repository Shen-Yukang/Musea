<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>深呼吸 - 重新专注</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            overflow: hidden;
            position: relative;
        }

        /* 摄像头背景 */
        #backgroundVideo {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -1;
        }

        /* 备用背景 */
        body.fallback-background {
            background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%);
        }

        /* 背景遮罩 */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            z-index: 0;
        }

        .container {
            text-align: center;
            position: relative;
            z-index: 1;
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        /* 开始按钮 */
        .start-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2rem;
        }

        .welcome-text {
            font-size: 1.8rem;
            font-weight: 300;
            margin-bottom: 1rem;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }

        .instruction-text {
            font-size: 1.1rem;
            opacity: 0.9;
            margin-bottom: 2rem;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
        }

        /* 呼吸引导区域 */
        .breathing-guide {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(15px);
            border-radius: 40px;
            padding: 4rem;
            text-align: center;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4);
            border: 2px solid rgba(255, 255, 255, 0.15);
            min-width: 400px;
            min-height: 400px;
        }

        .breathing-guide.active {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .breathing-circle {
            width: 280px;
            height: 280px;
            border: 4px solid rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            margin: 0 auto 2rem;
            position: relative;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .breathing-circle::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 85%;
            height: 85%;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            transition: all 0.3s ease;
        }

        /* 倒计时数字 */
        .countdown-number {
            position: absolute;
            font-size: 4rem;
            font-weight: bold;
            color: white;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.8);
            z-index: 10;
        }

        /* 4-7-8 呼吸法动画 */
        .breathing-circle.inhale::before {
            animation: inhale 4s ease-in-out;
        }

        .breathing-circle.hold::before {
            animation: hold 7s ease-in-out;
        }

        .breathing-circle.exhale::before {
            animation: exhale 8s ease-in-out;
        }

        .breathing-text {
            font-size: 2.2rem;
            margin-bottom: 1.5rem;
            font-weight: 400;
            text-shadow: 2px 2px 6px rgba(0, 0, 0, 0.7);
            color: #ffffff;
        }

        .timer {
            font-size: 1.4rem;
            opacity: 0.9;
            margin-top: 1.5rem;
            font-weight: 500;
        }

        /* 4-7-8 呼吸法动画 */
        .breathing-circle.inhale::before {
            animation: inhale 4s ease-in-out;
        }

        .breathing-circle.hold::before {
            animation: hold 7s ease-in-out;
        }

        .breathing-circle.exhale::before {
            animation: exhale 8s ease-in-out;
        }

        /* 提醒区域 - 移到顶部 */
        .reminder-section {
            position: absolute;
            top: 2rem;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            padding: 1rem 1.5rem;
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            max-width: 90%;
            z-index: 10;
        }

        .custom-message {
            font-size: 0.95rem;
            line-height: 1.4;
            margin-bottom: 0.3rem;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
        }

        .reason-display {
            font-size: 0.8rem;
            opacity: 0.7;
            color: rgba(255, 255, 255, 0.8);
        }

        /* 底部关闭按钮 */
        .close-section {
            position: absolute;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
        }

        .btn {
            padding: 1rem 2.5rem;
            border: 2px solid rgba(255, 255, 255, 0.4);
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            color: white;
            border-radius: 30px;
            cursor: pointer;
            font-size: 1.1rem;
            font-weight: 500;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
        }

        .btn:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.6);
            transform: translateY(-2px);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.3);
        }

        .btn.primary {
            background: rgba(74, 144, 226, 0.8);
            border-color: rgba(74, 144, 226, 1);
        }

        .btn.primary:hover:not(:disabled) {
            background: rgba(74, 144, 226, 1);
            border-color: rgba(74, 144, 226, 1);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* 动画关键帧 */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes inhale {
            0% {
                transform: translate(-50%, -50%) scale(0.8);
                opacity: 0.4;
                background: rgba(74, 144, 226, 0.3);
            }
            100% {
                transform: translate(-50%, -50%) scale(1.4);
                opacity: 0.8;
                background: rgba(74, 144, 226, 0.6);
            }
        }

        @keyframes hold {
            0%, 100% {
                transform: translate(-50%, -50%) scale(1.4);
                opacity: 0.8;
                background: rgba(255, 193, 7, 0.6);
            }
        }

        @keyframes exhale {
            0% {
                transform: translate(-50%, -50%) scale(1.4);
                opacity: 0.8;
                background: rgba(40, 167, 69, 0.6);
            }
            100% {
                transform: translate(-50%, -50%) scale(0.8);
                opacity: 0.4;
                background: rgba(40, 167, 69, 0.3);
            }
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .breathing-guide {
                padding: 2rem;
                margin: 1rem;
                min-width: 300px;
                min-height: 350px;
            }

            .breathing-circle {
                width: 200px;
                height: 200px;
            }

            .breathing-text {
                font-size: 1.6rem;
            }

            .countdown-number {
                font-size: 3rem;
            }

            .reminder-section {
                top: 1rem;
                padding: 0.8rem 1.2rem;
                max-width: 95%;
            }

            .custom-message {
                font-size: 0.85rem;
            }

            .reason-display {
                font-size: 0.75rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 开始界面 -->
        <div class="start-section" id="startSection">
            <div class="welcome-text">深呼吸时间</div>
            <div class="instruction-text">让我们通过4-7-8呼吸法重新获得专注力</div>
            <button class="btn primary" id="startBtn">开始深呼吸</button>
        </div>

        <!-- 呼吸引导界面 -->
        <div class="breathing-guide" id="breathingGuide">
            <div class="breathing-circle" id="breathingCircle">
                <div class="countdown-number" id="countdownNumber"></div>
            </div>
            <div class="breathing-text" id="breathingText">准备开始深呼吸...</div>
            <div class="timer" id="timer">剩余时间: 5:00</div>
        </div>

        <!-- 提醒区域 -->
        <div class="reminder-section">
            <div class="custom-message" id="customMessage">
                <!-- 自定义消息将在这里显示 -->
            </div>
            <div class="reason-display" id="reasonDisplay">
                <!-- 阈值超过原因将在这里显示 -->
            </div>
        </div>

        <!-- 底部关闭按钮 -->
        <div class="close-section">
            <button class="btn" id="closeBtn">关闭 (10秒后可用)</button>
        </div>
    </div>

    <script src="deep-breathing.js"></script>
</body>
</html>
